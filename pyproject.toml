[project]
name = "hass-hunch-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["hunch-engine"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = false

[tool.uv.sources]
hunch-engine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/hunch/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
