# German corpus for the "julian" export (golden/homes/julian.json). Expectations use real entity ids.
- prompt: Mach das Licht im Arbeitszimmer aus
  expect: {kind: resolved, verb: turn_off, targets: [light.arbeitszimmer_lichtschalter]}
- prompt: Schalte alle Lichter unten aus
  expect: {kind: resolved, verb: turn_off, targets: [light.wohnzimmer_bushira_max, light.wohnzimmer_deckenlampe, light.wohnzimmer_stehlampe, light.kuche_kucheninsel, light.kuche_spots, light.esszimmer_balkon_lichtschalter, light.esszimmer_loggia_lichtschalter, light.esszimmer_deckenlampe, light.esszimmer_stehlampe, light.vorzimmer_deckenlampe, light.vorzimmer_wandlampe, light.arbeitszimmer_lichtschalter, light.badezimmer_unten_lichtschalter_deckenlampe, light.badezimmer_unten_lichtschalter_spiegel]}
- prompt: Fahr die Rollos im Schlafzimmer runter
  expect: {kind: resolved, verb: close, targets: [cover.schlafzimmer_dachterrasse_rollo, cover.schlafzimmer_fenster_rollo]}
- prompt: Mach das Rollo in der Küche auf
  expect: {kind: resolved, verb: open, targets: [cover.kuche_fenster_rollo]}
- prompt: Rollos im Badezimmer oben halb runter
  # three identically named blinds; German plural hovers around collective_fallback (0.4), so the
  # engine either asks to confirm all three or asks which one — both acceptable, never silent.
  expect: {kinds: [resolved, confirm, clarify]}
- prompt: Mach die Spots in der Küche an
  expect: {kind: resolved, verb: turn_on, targets: [light.kuche_spots]}
- prompt: Deckenlampe im Wohnzimmer an
  expect: {kind: resolved, verb: turn_on, targets: [light.wohnzimmer_deckenlampe]}
- prompt: Schalte den Fernseher im Wohnzimmer aus
  expect: {kind: resolved, verb: turn_off, targets: [media_player.wohnzimmer_fernseher]}
- prompt: Lüfter im Badezimmer unten einschalten
  expect: {kind: resolved, verb: turn_on, targets: [fan.badezimmer_unten_lufter]}
- prompt: Schalte die Beetbewässerung ein
  expect: {kind: resolved, verb: turn_on, targets: [switch.balkon_beetbewasserung]}
- prompt: Fernseher im Schlafzimmer leiser
  expect: {kind: resolved, verb: set_volume, targets: [media_player.schlafzimmer_fernseher]}
- prompt: Stell die Klimaanlage auf 22 Grad
  # one live climate unit since disabled entities left the model (the 'Mobile Klimaanlage' was disabled)
  expect: {kinds: [resolved, confirm], verb: set_temperature, targets: [climate.midea_portasplit], params: {temperature: [22, 22]}}
- prompt: Wie warm ist es im Schlafzimmer?
  expect: {kind: resolved, verb: query_state}
- prompt: Ist das Fenster im Esszimmer offen?
  # two windows, doors and covers all plausible -> ask which
  expect: {kind: clarify}
- prompt: Mach alles aus außer dem Mini Kühlschrank
  # asks either because of the blast radius or because the verb was only agreed on weakly
  expect: {kind: confirm, verb: turn_off}
- prompt: Dachterrasse Rollo zu
  # two 'Dachterrasse Rollo' covers (Galerie, Schlafzimmer), no room named -> ask which
  expect: {kinds: [clarify]}
- prompt: Starte Peter
  # no vacuum verbs in the vocabulary yet: hand off, whichever way Jev gets there
  expect: {kind: escalate}
- prompt: Mach das Licht in zehn Minuten aus
  expect: {kind: escalate, reason: timing}
- prompt: Wie spät ist es?
  # either no verb fires (no_intent) or query_state fires and finds nothing (low_confidence)
  expect: {kind: escalate}

# ---- Julian's own prompts (2026-09-20), verbatim ----
- prompt: Badezimmer Rollos auf 15%
  # "Badezimmer Unten" has no covers, so the area intersection alone should land on the three upstairs blinds
  expect: {kind: resolved, verb: set_position, targets: [cover.badezimmer_oben_fenster_rollo_links, cover.badezimmer_oben_fenster_rollo_mitte, cover.badezimmer_oben_fenster_rollo_rechts], params: {position: [5, 25]}}
- prompt: Wie warm ist es im Wohnzimmer?
  expect: {kind: resolved, verb: query_state, targets: [sensor.wohnzimmer_temperatursensor_temperatur]}
- prompt: Wie warm ist es im Vorzimmer?
  # two "Temperatur" sensors in the Vorzimmer (room sensor 23.6 vs Eve plant sensor 21.4): picking the room one or asking are both fine
  expect: {kinds: [resolved, clarify]}
- prompt: Dreh den Fernseher im Schlafzimmer auf
  # Austrian "aufdrehen" = turn on, not "open"
  expect: {kind: resolved, verb: turn_on, targets: [media_player.schlafzimmer_fernseher]}
- prompt: Licht aus
  # 28 lights, no room: either confirm the sweep (blast radius) or ask which room
  expect: {kinds: [confirm, clarify]}
- prompt: Wohnzimmer Stehlampe aufdrehen
  # exposed since 2026-09-21 (before: not exposed -> the engine had to ask or hand off)
  expect: {kind: resolved, verb: turn_on, targets: [light.wohnzimmer_stehlampe]}
- prompt: Wandlicht im Schlafzimmer für 15 Minuten an
  expect: {kind: escalate, reason: timing}
- prompt: Welche Fenster sind offen?
  # a question about a set: summarising state is the fallback agent's job (Julian, 2026-09-21)
  expect: {kind: escalate, reason: query_collective}
- prompt: Wie viele Lichter sind an?
  expect: {kind: escalate, reason: query_collective}
- prompt: Ist die Dachterrassentür offen?
  # two "Tür" sensors on devices "Dachterrassentür" (Schlafzimmer, Galerie)
  expect: {kind: clarify}
- prompt: Wie viel ist 13 mal 8?
  expect: {kind: escalate}
- prompt: Rollos im Schlafzimmer schließen wenn es wärmer als 23 grad ist
  # numeric condition: not expressible in the two-slot condition model -> Jev's condition_numeric flag
  # hands it off before Round 2 (2026-09-21); never executes unconditionally, never a fake condition
  expect: {kind: escalate, reason: condition}
- prompt: Rollos im Schlafzimmer schließen wenn die Dachterrassentür offen ist
  # state condition: the door contact in the same room; 'offen' = binary_sensor 'on'
  expect: {kinds: [resolved, confirm], verb: close, targets: [cover.schlafzimmer_dachterrasse_rollo, cover.schlafzimmer_fenster_rollo], condition: {subject: binary_sensor.schlafzimmer_dachterrassentur_tur, state: 'on'}}
- prompt: Licht im Untergeschoss an
  expect: {kind: resolved, verb: turn_on, targets: [light.wohnzimmer_bushira_max, light.wohnzimmer_deckenlampe, light.wohnzimmer_stehlampe, light.kuche_kucheninsel, light.kuche_spots, light.esszimmer_balkon_lichtschalter, light.esszimmer_loggia_lichtschalter, light.esszimmer_deckenlampe, light.esszimmer_stehlampe, light.vorzimmer_deckenlampe, light.vorzimmer_wandlampe, light.arbeitszimmer_lichtschalter, light.badezimmer_unten_lichtschalter_deckenlampe, light.badezimmer_unten_lichtschalter_spiegel]}
- prompt: Licht im Untergeschoss aus ausser Wohnzimmer Stehlampe
  # all downstairs lights except the Wohnzimmer Stehlampe; 13 targets, asking is fine
  expect: {kinds: [resolved, confirm], verb: turn_off, targets: [light.wohnzimmer_bushira_max, light.wohnzimmer_deckenlampe, light.kuche_kucheninsel, light.kuche_spots, light.esszimmer_balkon_lichtschalter, light.esszimmer_loggia_lichtschalter, light.esszimmer_deckenlampe, light.esszimmer_stehlampe, light.vorzimmer_deckenlampe, light.vorzimmer_wandlampe, light.arbeitszimmer_lichtschalter, light.badezimmer_unten_lichtschalter_deckenlampe, light.badezimmer_unten_lichtschalter_spiegel]}

# ---- numbers: code lists them, Jev decides what they mean (2026-09-20) ----
- prompt: Rollos im Schlafzimmer 15% zu
  # "zu" = closed: 15% closed is position 85; the number pick hovers around 0.7, asking is fine
  expect: {kinds: [resolved, confirm], verb: set_position, targets: [cover.schlafzimmer_dachterrasse_rollo, cover.schlafzimmer_fenster_rollo], params: {position: [80, 90]}}
- prompt: Mach die Klimaanlage um 2 Grad wärmer
  # relative change: the engine does not know the current setpoint
  expect: {kind: escalate, reason: relative_change}
- prompt: Fernseher im Wohnzimmer um 20% leiser
  expect: {kind: escalate, reason: relative_change}
- prompt: Stell die Klimaanlage wärmer, draußen sind 5 Grad
  # the 5 is the weather, not the setpoint (param_value says none of these): rubric decides, never 5°C
  expect: {kinds: [resolved, confirm], verb: set_temperature, targets: [climate.midea_portasplit], params: {temperature: [16, 26]}}

# ---- floor aliases set in HA 2026-09-21 ('oben' / 'unten') ----
- prompt: Licht oben aus
  expect: {kind: resolved, verb: turn_off, targets: [light.ankleide_deckenlampe_lichtschalter, light.ankleide_spiegel, light.badezimmer_oben_lichtschalter_deckenlampe, light.badezimmer_oben_lichtschalter_spiegel, light.galerie_dachterrasse_lichtschalter, light.galerie_deckenlampe_lichtschalter, light.galerie_stiegenlampe, light.schlafzimmer_lichtschalter, light.schlafzimmer_wandlicht]}
- prompt: Mach unten das Licht an
  expect: {kind: resolved, verb: turn_on, targets: [light.wohnzimmer_bushira_max, light.wohnzimmer_deckenlampe, light.wohnzimmer_stehlampe, light.kuche_kucheninsel, light.kuche_spots, light.esszimmer_balkon_lichtschalter, light.esszimmer_loggia_lichtschalter, light.esszimmer_deckenlampe, light.esszimmer_stehlampe, light.vorzimmer_deckenlampe, light.vorzimmer_wandlampe, light.arbeitszimmer_lichtschalter, light.badezimmer_unten_lichtschalter_deckenlampe, light.badezimmer_unten_lichtschalter_spiegel]}
- prompt: Rollos oben runter
  # 10 upstairs blinds; asking to confirm is fine
  expect: {kinds: [resolved, confirm], verb: close, targets: [cover.badezimmer_oben_fenster_rollo_links, cover.badezimmer_oben_fenster_rollo_mitte, cover.badezimmer_oben_fenster_rollo_rechts, cover.galerie_dachterrasse_rollo, cover.galerie_fenster_rollo_links, cover.galerie_fenster_rollo_mitte, cover.galerie_fenster_rollo_rechts, cover.galerie_stiege_fenster_rollo, cover.schlafzimmer_dachterrasse_rollo, cover.schlafzimmer_fenster_rollo]}

# ---- mixed places: a set in one room, a specific device in another (2026-09-21, live test) ----
- prompt: schalte licht in der küche und esszimmer stehlampe ein
  # the Küche room verdict sits at 0.8–0.9 'all of them'; a hesitant run asks to confirm, never drops the room
  expect: {kinds: [resolved, confirm], verb: turn_on, targets: [light.kuche_spots, light.kuche_kucheninsel, light.esszimmer_stehlampe]}
- prompt: Schalte das Licht in der Küche und die Esszimmer Stehlampe ein
  expect: {kinds: [resolved, confirm], verb: turn_on, targets: [light.kuche_spots, light.kuche_kucheninsel, light.esszimmer_stehlampe]}

# ---- follow-ups: the second sentence leans on the first (2026-09-21) ----
- turns: ["was steht auf der einkaufsliste?", "was genau steht drauf"]
  expect: {kind: resolved, verb: query_state, targets: [todo.shopping_list]}
- turns: ["Licht in der Küche an", "und im Esszimmer"]
  expect: {kind: resolved, verb: turn_on, targets: [light.esszimmer_deckenlampe, light.esszimmer_stehlampe]}
- turns: ["Licht in der Küche an", "aus"]
  expect: {kind: resolved, verb: turn_off, targets: [light.kuche_kucheninsel, light.kuche_spots]}
- turns: ["Licht in der Küche an", "die Esszimmer Stehlampe auch"]
  expect: {kind: resolved, verb: turn_on, targets: [light.esszimmer_stehlampe, light.kuche_kucheninsel, light.kuche_spots]}
- turns: ["Wie warm ist es im Wohnzimmer?", "und im Schlafzimmer?"]
  expect: {kind: resolved, verb: query_state, targets: [sensor.schlafzimmer_temperatursensor_temperatur]}
- turns: ["Kücheninsel auf 35%", "und die Spots"]
  expect: {kind: resolved, verb: set_brightness, targets: [light.kuche_kucheninsel, light.kuche_spots], params: {brightness_pct: [35, 35]}}
- turns: ["Licht in der Küche an", "Rollos im Schlafzimmer runter"]
  # a complete sentence after another: a new request, not a follow-up
  expect: {kind: resolved, verb: close, targets: [cover.schlafzimmer_dachterrasse_rollo, cover.schlafzimmer_fenster_rollo]}
