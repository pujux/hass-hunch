[project]
name = "hunch-engine"
version = "0.2.0"
description = "Typed-decision fast path for Home Assistant requests, powered by Jev"
requires-python = ">=3.13"
dependencies = ["typesafe-sdk>=0.7,<0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]
