[project]
name = "hunch-engine"
version = "0.5.1"
description = "Typed-decision fast path for Home Assistant requests, powered by Jev"
requires-python = ">=3.13"
dependencies = ["typesafe-sdk>=0.7,<0.8"]

[project.urls]
Homepage = "https://github.com/pujux/hass-hunch"
Repository = "https://github.com/pujux/hass-hunch"
Issues = "https://github.com/pujux/hass-hunch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]
