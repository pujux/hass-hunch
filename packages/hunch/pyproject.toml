[project]
name = "hunch"
version = "0.1.0"
description = "Typed-decision fast path for Home Assistant requests, powered by Jev"
requires-python = ">=3.13,<3.14"
dependencies = ["typesafe-sdk>=0.7,<0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]
